{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ладно — Дневник настроений</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Специфичные стили только для лендинга: кораблик и контейнер */
    .landing-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }
    
    /* Кораблик на фоне */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">%0A  <path d="M20,140 L180,140 L200,170 L0,170 Z" fill="%238B5A2B" opacity="0.8"/>%0A  <path d="M40,140 L160,140 L170,150 L30,150 Z" fill="%23D4A574" opacity="0.9"/>%0A  <line x1="100" y1="140" x2="100" y2="20" stroke="%236B4226" stroke-width="4" opacity="0.9"/>%0A  <path d="M100,30 L100,120 L170,120 Z" fill="%23FFFFFF" opacity="0.85"/>%0A  <path d="M95,40 L95,110 L40,110 Z" fill="%23FFF8E7" opacity="0.75"/>%0A  <path d="M100,20 L130,25 L100,30 Z" fill="%23FF6B6B" opacity="0.9"/>%0A  <path d="M30,170 L170,170 L180,190 L20,190 Z" fill="%238B5A2B" opacity="0.3"/>%0A</svg>');
      background-repeat: no-repeat;
      background-size: 450px;
      background-position: -100px 50%;
      animation: sail 35s ease-in-out infinite;
      pointer-events: none;
    }
    
    @keyframes sail {
      0% {
        background-position: -200px 60%;
      }
      50% {
        background-position: calc(100% + 200px) 40%;
      }
      100% {
        background-position: -200px 60%;
      }
    }
    
    /* Переопределяем ширину карточки для лендинга */
    .landing-container .glass-card {
      max-width: 500px;
      padding: 3rem 2.5rem;
    }
    
    @media (max-width: 480px) {
      .landing-container .glass-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <div class="glass-card">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 6V12L15 15" stroke="#4A9E86" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="9" stroke="#4A9E86" stroke-width="1.8"/>
            <path d="M12 8C10.8954 8 10 8.89543 10 10" stroke="#4A9E86" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="landing-title" style="font-size:3rem; font-weight:700; background:linear-gradient(135deg,#2D6A4F 0%,#40916C 50%,#2D6A4F 100%); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:0.5rem;">Ладно</h1>
        <p class="landing-subtitle" style="font-size:1.1rem; color:#6B8F7F; margin-bottom:2rem; font-weight:500;">Дневник настроений</p>
        <p class="landing-description" style="font-size:0.9rem; color:#7C9E8E; margin-bottom:2rem; line-height:1.6;">
          Отмечайте эмоции, ищите паттерны и получайте мягкие рекомендации от ИИ.
        </p>
      </div>
      
      <div class="button-group" style="display:flex; flex-direction:column; gap:1rem; margin-bottom:2rem;">
        <a href="{% url 'login' %}" class="btn-primary" style="text-align:center; text-decoration:none;">Войти</a>
        <a href="{% url 'signup' %}" class="btn-primary" style="text-align:center; text-decoration:none; background:transparent; color:#4A9E86; border:2px solid #4A9E86; box-shadow:none;" 
           onmouseover="this.style.background='rgba(74,158,134,0.1)'" onmouseout="this.style.background='transparent'">Зарегистрироваться</a>
      </div>
      
      <p class="landing-footer" style="font-size:0.75rem; color:#A8C4B6; letter-spacing:0.5px; text-align:center;">mood tracking • self care • AI insights</p>
    </div>
  </div>
</body>
</html>
