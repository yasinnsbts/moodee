{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Ладно</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glass-card">
    <div class="logo-area">
      <div class="logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 12V8H16M20 12L12 4L4 12H8V20H16V12H20Z" stroke="#4A9E86" stroke-width="1.5"/>
        </svg>
      </div>
      <h2>Регистрация</h2>
      <div class="subhead">Создайте аккаунт</div>
    </div>

    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="messages">
          {% for field, errors in form.errors.items %}
            {% for error in errors %}
              <div class="message">{{ error }}</div>
            {% endfor %}
          {% endfor %}
        </div>
      {% endif %}

      <div class="input-group">
        <label>Имя пользователя</label>
        <input class="input-field" type="text" name="username" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input class="input-field" type="email" name="email" required>
      </div>

      <div class="input-group">
        <label>Пароль</label>
        <input class="input-field" type="password" name="password1" id="id_password1" required>
      </div>

      <div class="input-group">
        <label>Подтвердите пароль</label>
        <input class="input-field" type="password" name="password2" id="id_password2" required>
      </div>

      <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>

    <div class="footer-action">
      Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </div>
  </div>
</body>
</html>
