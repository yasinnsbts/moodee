{% extends "base.html" %}

{% block title %}Смена пароля — Ладно{% endblock %}

{% block content %}
<section class="screen">
    <h1>Смена пароля</h1>
    <p>Обновите пароль для защиты аккаунта</p>

    <form class="form" method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="primary" type="submit">Сохранить</button>
    </form>

    <a href="{% url 'profile' %}">Вернуться в профиль</a>
</section>
{% endblock %}
