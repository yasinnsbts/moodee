{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Ладно</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glass-card">
    <div class="logo-area">
      <div class="logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 6V12L15 15" stroke="#4A9E86" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="9" stroke="#4A9E86" stroke-width="1.8"/>
          <path d="M12 8C10.8954 8 10 8.89543 10 10" stroke="#4A9E86" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>Вход</h2>
      <div class="subhead">Добро пожаловать</div>
    </div>

    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="messages">
          {% for error in form.non_field_errors %}
            <div class="message">{{ error }}</div>
          {% endfor %}
        </div>
      {% endif %}

      <div class="input-group">
        <label>Имя пользователя</label>
        <input class="input-field" type="text" name="username" placeholder="username" autofocus required>
      </div>

      <div class="input-group">
        <label>Пароль</label>
        <input class="input-field" type="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="flex-row">
        <label class="checkbox">
          <input type="checkbox" name="remember"> 
          <span>Запомнить меня</span>
        </label>
        <a href="#" class="forgot-link" onclick="alert('Восстановление пароля будет доступно позже'); return false;">Забыли пароль?</a>
      </div>

      <button type="submit" class="btn-primary">Войти</button>
    </form>

    <div class="divider">
      <span class="divider-line"></span>
      <span>или войдите через</span>
      <span class="divider-line"></span>
    </div>

    <div class="social-buttons">
      <button class="social-btn" type="button" disabled>Google</button>
      <button class="social-btn" type="button" disabled>Facebook</button>
    </div>

    <div class="footer-action">
      Новый пользователь? <a href="{% url 'signup' %}">Создать аккаунт</a>
    </div>
  </div>
</body>
</html>
