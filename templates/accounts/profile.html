{% extends "base.html" %}

{% block title %}Профиль — Ладно{% endblock %}

{% block content %}
<section class="screen">
    <h1>Профиль и настройки</h1>

    <div class="card">
        <h2>{{ request.user.first_name|default:request.user.username }}</h2>
        <p>{{ request.user.email }}</p>
    </div>

    <form class="form" method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="primary" type="submit">Сохранить настройки</button>
    </form>

    <a class="button secondary" href="{% url 'password_change' %}">Сменить пароль</a>
    <a class="button danger" href="{% url 'delete_account' %}">Удалить аккаунт</a>
    <form class="inline-form" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="secondary" type="submit">Выйти</button>
    </form>
</section>
{% endblock %}
